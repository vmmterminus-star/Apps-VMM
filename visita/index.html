<style>
:root{--page:#f4f1fb;--card:#fff;--glass:rgba(255,255,255,.72);--sunken:#f5f3f8;--line:#ebe8f2;--line2:#d9d5e4;--ink:#1c1a24;--muted:#6b6878;--subtle:#706c83;--action:#121117;--focus:#8a73f0;
--sh-card:0 1px 2px rgba(28,26,36,.04),0 6px 20px rgba(108,86,160,.07);--sh-action:0 6px 16px rgba(18,17,23,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{font-family:Poppins,system-ui,-apple-system,sans-serif;color:var(--ink);font-size:13px;line-height:20px;background:var(--page);min-height:100vh;
background-image:radial-gradient(60% 40% at 100% 0,#f6d6ee 0,transparent 70%),radial-gradient(50% 40% at 0 10%,#e3dafb 0,transparent 70%),radial-gradient(60% 40% at 100% 70%,#fde0d3 0,transparent 70%);background-attachment:fixed}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:12px;line-height:18px;margin-top:4px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh-card);padding:16px}
.prog{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#3fb37a;border-radius:999px;transition:width .3s}
.row{display:flex;align-items:center;gap:8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:16px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;height:64px;border-radius:12px;background:var(--card);box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:16px;font-weight:500;color:var(--muted);position:relative}
.day b{font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.day.sel{background:var(--action);color:#fff}.day.sel b{color:#fff}
.day .dot{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#3fb37a}
.day.today:not(.sel){outline:2px solid var(--action);outline-offset:-2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;background:var(--sunken);font-size:12px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--action);color:#fff}
.sec{font-size:15px;line-height:22px;font-weight:600;margin:24px 0 8px}
.focus{background:var(--card);border-radius:16px;box-shadow:var(--sh-card);padding:16px;margin-top:16px}
.lbl{font-size:11px;line-height:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;box-shadow:var(--sh-card);padding:12px;margin-bottom:12px}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.cb{flex:0 0 44px;height:44px;margin:-8px -6px -8px -8px;display:flex;align-items:center;justify-content:center}
.cb span{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center}
.done .cb span{background:#3fb37a;border-color:#3fb37a}
.cb svg{width:14px;height:14px;opacity:0}.done .cb svg{opacity:1}
.tm{font-size:12px;line-height:18px;color:var(--muted)}
.tt{font-size:13px;line-height:20px;font-weight:500;margin-top:2px}
.det{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:18px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;line-height:16px;font-weight:500;padding:3px 10px;border-radius:999px}
.p-valen{background:#ebe5fd;color:#5b45b8}.p-pili{background:#fbe3f3;color:#a1307a}.p-hermano{background:#ddeffb;color:#1f6aa0}
.p-mama{background:#fde8d9;color:#a2521c}.p-papa{background:#fdf3d3;color:#8a6410}.p-angeles{background:#ddf3e6;color:#23764a}.p-todos{background:var(--sunken);color:var(--muted)}
.btn{height:44px;padding:0 20px;border-radius:999px;background:var(--action);color:#fff;font-weight:500;font-size:13px;box-shadow:var(--sh-action)}
.btn2{height:44px;padding:0 16px;border-radius:999px;background:var(--sunken);font-weight:500;font-size:13px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner{border-radius:16px;padding:14px 16px;background:#ddf3e6;color:#23764a;margin-top:16px}
.banner b{font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;box-shadow:0 12px 32px rgba(108,86,160,.18);padding:6px;display:flex;gap:4px}
.nav button{height:44px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.nav button.on{background:var(--action);color:#fff}
.cal{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--sh-card);padding:12px;margin-bottom:12px;width:100%;text-align:left}
.cal .d{flex:0 0 44px;text-align:center}.cal .d b{display:block;font-size:20px;line-height:26px;font-weight:600}
.cal .d small{font-size:11px;color:var(--muted)}
.cal .x{flex:1;min-width:0}
.cal .n{font-size:12px;color:var(--muted)}
.cal.past{opacity:.6}
.mini{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:#3fb37a}
.rule{display:flex;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--sh-card);padding:14px;margin-bottom:12px}
.rule .e{font-size:20px;line-height:24px}
.rule b{font-weight:600;display:block}
.rule span{color:var(--muted);font-size:12px;line-height:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translate(-50%,20px);background:var(--action);color:#fff;padding:10px 18px;border-radius:999px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Casa lista</h1>
  <div class="sub" id="countdown"></div>
  <div class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><span class="lbl">Avance total</span><span class="tm" id="totalTxt"></span></div>
    <div class="prog"><i id="totalBar"></i></div>
  </div>

  <section id="v-hoy">
    <div class="days" id="days"></div>
    <div class="chips" id="chips"></div>
    <div id="angBanner"></div>
    <div id="next"></div>
    <div class="sec" id="dayTitle"></div>
    <div id="list"></div>
  </section>

  <section id="v-cal" class="hide">
    <div class="sec">Todo el plan</div>
    <div id="calList"></div>
  </section>

  <section id="v-reglas" class="hide">
    <div class="sec">Reglas fijas</div>
    <div id="rules"></div>
  </section>
</div>

<nav class="nav">
  <button data-v="hoy" class="on">Hoy</button>
  <button data-v="cal">Calendario</button>
  <button data-v="reglas">Reglas</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const P={valen:"Valen",pili:"Pili",hermano:"Hermano",mama:"Mamá",papa:"Papá",angeles:"Ángeles",todos:"Todos"};
const DW=["dom","lun","mar","mié","jue","vie","sáb"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const NOCLORO="Nada de cloro ni amoniaco. El enzimático se aplica hasta empapar, no se enjuaga y se deja secar al aire. Nada de vapor ni secadora caliente.";

// t: hora, w: personas, x: tarea, d: detalle (lista), wa: fecha del día de Ángeles cuyo mensaje se copia
const PLAN={
"2026-11-15":{ang:null,t:[
 {t:"16:00",w:["valen"],x:"Hacer el pedido en línea",d:["Lámpara UV","Enzimático (un galón)","Pañales para la perrita","2 protectores impermeables de colchón","Cinta de pintor","Bolsas grandes y cajas"]},
 {t:"16:15 – 16:45",w:["valen"],x:"Decidir el acomodo de la sala y marcar con cinta dónde va cada cuadro y repisa"},
 {t:"16:45 – 18:15",w:["papa","hermano","valen"],x:"Mover los muebles de la sala"},
 {t:"18:15 – 19:45",w:["papa","hermano"],x:"Colgar cuadros y repisas (Valen indica dónde)",d:["No colgar en paredes donde meó la gata hasta limpiarlas"]},
 {t:"20:00 – 20:30",w:["todos"],x:"Plática familiar",d:["Explicar el plan y quién hace qué","Reglas: nada de cloro, puerta de Pili cerrada, pañales","Pili se pasa al cuarto de Valen el sáb 28"]},
 {t:"20:45",w:["valen"],x:"WhatsApp a Ángeles con lo del lunes",wa:"2026-11-16"}]},
"2026-11-16":{ang:"Lavar la ropa del cuarto de Pili",t:[
 {t:"8:45",w:["pili"],x:"Quitar sábanas, cobijas, fundas, cortinas y tapetes y dejarlos en un montón"},
 {t:"9:00",w:["mama"],x:"Explicarle a Ángeles el plan y las reglas (10 min)"},
 {t:"9:00",w:["hermano"],x:"Si el pedido no llegó: comprar enzimático y pañales en la tienda de mascotas"},
 {t:"9:15 – 14:00",w:["angeles"],x:"Lavar la ropa del cuarto de Pili",d:["Agua fría con detergente y enzimático","Secar al sol"]},
 {t:"Al llegar",w:["pili"],x:"Empezar con los pañales de la perrita",d:["Cambiarlo cada pocas horas","Limpiarle la piel en cada cambio","Si la piel se pone roja, preguntar al veterinario"]}]},
"2026-11-17":{ang:null,t:[
 {t:"10:00 – 12:00",w:["pili","hermano"],x:"Depurar el cuarto de Pili",d:["3 bolsas con etiqueta: se queda / donar / tirar"]},
 {t:"16:00",w:["hermano"],x:"Sacar las bolsas de basura"},
 {t:"19:00 – 20:00",w:["valen","pili"],x:"Recorrer toda la casa con la lámpara UV y marcar cada mancha con cinta"},
 {t:"20:00",w:["pili"],x:"Desde hoy la puerta de su cuarto va siempre cerrada (sin gatas)"},
 {t:"20:15",w:["valen"],x:"WhatsApp a Ángeles con lo del miércoles",wa:"2026-11-18"}]},
"2026-11-18":{ang:"Cuarto de Pili, 1ª ronda de enzimático",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"1ª ronda de enzimático en el cuarto de Pili",d:["Aspirar y mover la cama","Enzimático en cada cinta","Colchón por los dos lados y base de la cama","Zoclos y paredes marcadas","Ventana abierta, puerta cerrada al salir"]},
 {t:"20:30",w:["pili"],x:"Revisar que el colchón esté seco. Si no, dormir en otro lado esta noche"}]},
"2026-11-19":{ang:null,t:[
 {t:"10:00 – 13:00",w:["pili","hermano"],x:"Depurar la cocina",d:["Caducados de la alacena","Cajones","Trastes rotos o repetidos","Tuppers sin tapa"]},
 {t:"19:00 – 19:30",w:["mama"],x:"Revisar lo que salió de la cocina y decidir lo que quedó en duda"},
 {t:"20:00",w:["valen"],x:"WhatsApp a Ángeles con lo del viernes",wa:"2026-11-20"}]},
"2026-11-20":{ang:"Cocina a fondo",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"Limpieza a fondo de la cocina",d:["Por dentro de alacenas y cajones","Refri","Estufa, horno y campana","Azulejos y piso"]}]},
"2026-11-21":{ang:null,t:[
 {t:"10:00 – 12:00",w:["todos"],x:"Depurar la sala"},
 {t:"12:00 – 14:00",w:["todos"],x:"Depurar el estudio"},
 {t:"16:00",w:["papa"],x:"Tirar lo grande que salió de la depuración"}]},
"2026-11-22":{ang:null,t:[
 {t:"20:00",w:["valen"],x:"WhatsApp a Ángeles con lo del lunes",wa:"2026-11-23"}]},
"2026-11-23":{ang:"Paredes y zoclos marcados del resto de la casa",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"Enzimático en cada cinta fuera del cuarto de Pili",d:["Paredes","Zoclos","Pisos marcados"]}]},
"2026-11-24":{ang:null,t:[
 {t:"10:00 – 12:00",w:["pili","hermano"],x:"Meter las donaciones en cajas con etiqueta"},
 {t:"19:00",w:["valen"],x:"Repasar el cuarto de Pili con la UV y marcar con cinta de otro color lo que todavía brille"},
 {t:"20:00",w:["valen"],x:"WhatsApp a Ángeles con lo del miércoles",wa:"2026-11-25"}]},
"2026-11-25":{ang:"Cuarto de Pili, 2ª ronda de enzimático",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"2ª ronda de enzimático en el cuarto de Pili",d:["Solo en la cinta de color nuevo","Ventana abierta, puerta cerrada al salir"]},
 {t:"20:30",w:["pili"],x:"Revisar que el colchón esté seco. Si no, dormir en otro lado esta noche"}]},
"2026-11-26":{ang:null,t:[
 {t:"11:00",w:["hermano"],x:"Llevar las donaciones"},
 {t:"20:00",w:["valen"],x:"WhatsApp a Ángeles con lo del viernes",wa:"2026-11-27"}]},
"2026-11-27":{ang:"Sala y estudio a fondo",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"Limpieza a fondo de la sala y el estudio",d:["Aspirar el sillón","Enzimático en la tapicería marcada","Ventanas","Polvo de libreros y repisas","Pisos"]}]},
"2026-11-28":{ang:null,t:[
 {t:"10:00 – 12:00",w:["pili"],x:"Pasarse al cuarto de Valen con la perrita"},
 {t:"12:00",w:["valen"],x:"Poner el protector en tu colchón y el tapete lavable para la perrita"},
 {t:"12:15",w:["pili"],x:"Cerrar su cuarto. Ya nadie entra hasta que llegue la visita"},
 {t:"Libre",w:["todos"],x:"Margen: terminar lo que se haya atrasado"}]},
"2026-11-29":{ang:null,t:[
 {t:"Libre",w:["todos"],x:"Margen: terminar lo que se haya atrasado"},
 {t:"20:00",w:["valen"],x:"WhatsApp a Ángeles con lo del lunes",wa:"2026-11-30"}]},
"2026-11-30":{ang:"Limpieza final del cuarto de Pili y el baño de la visita",t:[
 {t:"9:00 – 14:00",w:["angeles"],x:"Limpieza final del cuarto de Pili (ya vacío) y del baño de la visita",d:["Ventanas","Clóset por dentro","Puerta y lámpara","Piso","Baño completo"]}]},
"2026-12-01":{ang:null,t:[
 {t:"10:00 – 11:00",w:["pili","hermano"],x:"Armar el cuarto de la visita",d:["Colchón con protector","Sábanas limpias","Toallas","Ganchos libres en el clóset"]},
 {t:"18:30",w:["valen"],x:"Última revisión con la lámpara UV"},
 {t:"19:30",w:["todos"],x:"Todo listo y el cuarto cerrado. La visita llega en la noche 🎉"}]}
};
const RULES=[
 ["🚫","Nada de cloro ni amoniaco","El amoniaco hace que las gatas regresen a marcar. El cloro con orina suelta gases tóxicos."],
 ["💧","Enzimático: empapar y dejar","No se enjuaga ni se talla fuerte. Se deja secar al aire."],
 ["🔥","Nada de calor en las manchas","Ni vapor ni secadora caliente: fijan el olor."],
 ["🚪","Cuarto de Pili siempre cerrado","Desde el mar 17, para que las gatas no vuelvan a marcar."],
 ["🐶","Pañal a la perrita","Cambiarlo cada pocas horas y limpiarle la piel en cada cambio."],
 ["🛏️","Colchón seco antes de dormir","Los días de enzimático, si sigue húmedo, Pili duerme en otro lado."]
];

const KEYS=Object.keys(PLAN);
const id=(k,i)=>k+"#"+i;
let done={};try{done=JSON.parse(localStorage.getItem("nacho_done")||"{}")}catch(e){}
let filt="todos";try{filt=localStorage.getItem("nacho_f")||"todos"}catch(e){}
const save=()=>{try{localStorage.setItem("nacho_done",JSON.stringify(done));localStorage.setItem("nacho_f",filt)}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const now=new Date();const todayK=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
let sel=todayK<KEYS[0]?KEYS[0]:(todayK>KEYS[KEYS.length-1]?KEYS[KEYS.length-1]:todayK);
const dt=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=k=>{const d=dt(k);return DW[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()]};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const vis=t=>filt==="todos"||t.w.includes(filt)||t.w.includes("todos");
const dayCount=k=>{const ts=PLAN[k].t;return[ts.filter((_,i)=>done[id(k,i)]).length,ts.length]};

function angMsg(k){
 const day=PLAN[k];const d=dt(k);
 const largo=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][d.getDay()];
 let s="Hola Ángeles 😊 Para el "+largo+" "+d.getDate()+" la tarea del día es: *"+day.ang+"*\n";
 day.t.filter(t=>t.w.includes("angeles")).forEach(t=>{(t.d||[t.x]).forEach(x=>s+="• "+x+"\n")});
 s+="\nImportante: "+NOCLORO+"\n¡Muchas gracias!";
 return s;
}
function copy(txt){
 const ok=()=>toast("Mensaje copiado");
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,()=>fb())}else fb();
 function fb(){const a=document.createElement("textarea");a.value=txt;a.style.fontSize="16px";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
const tags=w=>'<div class="tags">'+w.map(p=>'<span class="tag p-'+p+'">'+P[p]+'</span>').join("")+'</div>';
const chk='<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function taskHTML(k,i,t){
 const isD=!!done[id(k,i)];
 let h='<div class="task'+(isD?' done':'')+'"><button class="cb" data-k="'+k+'" data-i="'+i+'" aria-label="Marcar"><span>'+chk+'</span></button><div style="flex:1;min-width:0">';
 h+='<div class="tm">'+t.t+'</div><div class="tt">'+esc(t.x)+'</div>';
 if(t.d)h+='<ul class="det">'+t.d.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
 h+=tags(t.w);
 if(t.wa)h+='<div class="acts"><button class="btn" data-copy="'+t.wa+'">Copiar mensaje</button><a class="btn2" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(angMsg(t.wa))+'">Abrir WhatsApp</a></div>';
 return h+'</div></div>';
}

function render(){
 // countdown + total
 const arr=dt("2026-12-01");const td=dt(todayK);const diff=Math.round((arr-td)/864e5);
 document.getElementById("countdown").textContent=diff>1?"La visita llega en "+diff+" días · mar 1 dic en la noche":diff===1?"La visita llega mañana en la noche":diff===0?"La visita llega hoy en la noche":"La visita ya está en casa";
 let a=0,b=0;KEYS.forEach(k=>{const[x,y]=dayCount(k);a+=x;b+=y});
 document.getElementById("totalTxt").textContent=a+" de "+b+" tareas";
 document.getElementById("totalBar").style.width=(b?a/b*100:0)+"%";
 // days
 document.getElementById("days").innerHTML=KEYS.map(k=>{const d=dt(k);const[x,y]=dayCount(k);
  return '<button class="day'+(k===sel?' sel':'')+(k===todayK?' today':'')+'" data-day="'+k+'">'+DW[d.getDay()]+'<b>'+d.getDate()+'</b>'+(x===y&&y?'<span class="dot"></span>':'')+'</button>'}).join("");
 // chips
 document.getElementById("chips").innerHTML=["todos","valen","pili","hermano","mama","papa","angeles"].map(p=>'<button class="chip'+(p===filt?' on':'')+'" data-f="'+p+'">'+(p==="todos"?"Todos":P[p])+'</button>').join("");
 const day=PLAN[sel];
 document.getElementById("angBanner").innerHTML=day.ang?'<div class="banner"><div class="lbl" style="color:#23764a">Día de Ángeles</div><b>'+esc(day.ang)+'</b></div>':'';
 const items=day.t.map((t,i)=>[t,i]).filter(([t])=>vis(t));
 const pend=items.filter(([t,i])=>!done[id(sel,i)]);
 document.getElementById("next").innerHTML=pend.length?'<div class="focus"><div class="lbl">Lo siguiente</div><div class="tt" style="font-size:15px;line-height:22px;font-weight:600;margin-top:4px">'+esc(pend[0][0].x)+'</div><div class="tm">'+pend[0][0].t+'</div></div>':(items.length?'<div class="focus"><div class="lbl">Listo</div><div class="tt">Todo lo de este día está hecho ✨</div></div>':'');
 const[x,y]=dayCount(sel);
 document.getElementById("dayTitle").textContent=fmt(sel).replace(/^./,c=>c.toUpperCase())+" · "+x+"/"+y;
 document.getElementById("list").innerHTML=items.length?items.map(([t,i])=>taskHTML(sel,i,t)).join(""):'<div class="empty">Nada para '+P[filt]+' este día</div>';
 // calendar
 document.getElementById("calList").innerHTML=KEYS.map(k=>{const d=dt(k);const[x,y]=dayCount(k);const pd=PLAN[k];
  return '<button class="cal'+(k<todayK?' past':'')+'" data-go="'+k+'"><div class="d"><small>'+DW[d.getDay()]+'</small><b>'+d.getDate()+'</b></div><div class="x"><div class="tt" style="margin:0">'+(pd.ang?'Ángeles: '+esc(pd.ang):esc(pd.t[0].x))+'</div><div class="n">'+x+' de '+y+' tareas'+(k===todayK?' · hoy':'')+'</div><div class="mini"><i style="width:'+(y?x/y*100:0)+'%"></i></div></div></button>'}).join("");
 document.getElementById("rules").innerHTML=RULES.map(r=>'<div class="rule"><div class="e">'+r[0]+'</div><div><b>'+r[1]+'</b><span>'+r[2]+'</span></div></div>').join("");
}

function show(v){["hoy","cal","reglas"].forEach(n=>document.getElementById("v-"+n).classList.toggle("hide",n!==v));
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));window.scrollTo(0,0)}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v)show(b.dataset.v);
 else if(b.dataset.day){sel=b.dataset.day;render()}
 else if(b.dataset.f){filt=b.dataset.f;save();render()}
 else if(b.dataset.k){const k=id(b.dataset.k,b.dataset.i);done[k]?delete done[k]:done[k]=1;save();render()}
 else if(b.dataset.copy)copy(angMsg(b.dataset.copy));
 else if(b.dataset.wa)location.href="https://wa.me/?text="+encodeURIComponent(angMsg(b.dataset.wa));
 else if(b.dataset.go){sel=b.dataset.go;show("hoy");render()}
});
render();
const s=document.querySelector(".day.sel");if(s)s.scrollIntoView({inline:"center",block:"nearest"});
</script>
</body>
</html>
